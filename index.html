<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contatos Grupo Arena CP</title>
<style>
:root{
  --bg:#f6f3ee; --surface:#ffffff; --surface-2:#f0ebe3; --text:#1f1a14; --muted:#6e6458;
  --border:#e2dbd0; --accent:#b8860b; --accent-ink:#ffffff; --accent-soft:#f5e9cc; --wa:#1e9e57;
  --shadow:0 1px 2px rgba(40,30,15,.06),0 4px 14px rgba(40,30,15,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15120e; --surface:#1f1b16; --surface-2:#2a251e; --text:#f2ece3; --muted:#a89d8f;
    --border:#3a332a; --accent:#e0ac3a; --accent-ink:#1a1408; --accent-soft:#3a2f17; --wa:#3cc47a;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#15120e; --surface:#1f1b16; --surface-2:#2a251e; --text:#f2ece3; --muted:#a89d8f;
  --border:#3a332a; --accent:#e0ac3a; --accent-ink:#1a1408; --accent-soft:#3a2f17; --wa:#3cc47a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:center;gap:16px;padding:14px 0}
.logo{height:52px;width:auto;display:block}
.logo-fallback{display:none;font-weight:800;font-size:20px;color:var(--accent)}
h1{font-size:20px;margin:0;line-height:1.2}
.sub{color:var(--muted);font-size:13px}
.spacer{flex:1}
.theme-btn{border:1px solid var(--border);background:var(--surface-2);color:var(--text);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:13px}
.tools{display:flex;gap:10px;flex-wrap:wrap;padding:0 0 14px}
.search{flex:1 1 320px;position:relative}
.search input{width:100%;padding:12px 40px 12px 40px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2);color:var(--text);font-size:16px;outline:none}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--muted);font-size:20px;cursor:pointer;display:none;padding:4px 8px}
.company{flex:0 1 240px;position:relative}
.company input{width:100%;padding:11px 34px 11px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2);color:var(--text);font-size:14px;outline:none}
.company input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.toggle{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);cursor:pointer;user-select:none}
.toggle input{accent-color:var(--accent);width:16px;height:16px}
.group-h{grid-column:1/-1;display:flex;align-items:center;gap:10px;margin-top:10px;padding:8px 4px;border-bottom:2px solid var(--accent-soft);cursor:pointer;user-select:none}
.group-h:first-child{margin-top:0}
.group-h .gname{font-weight:700;font-size:16px;overflow-wrap:anywhere}
.group-h .gcount{font-size:12px;color:var(--accent-ink);background:var(--accent);border-radius:999px;padding:1px 9px;font-weight:600}
.group-h .chev{margin-left:auto;color:var(--muted);transition:transform .15s}
.group-h.closed .chev{transform:rotate(-90deg)}
.group-h .only{font-size:12px;color:var(--muted);border:1px solid var(--border);border-radius:6px;padding:2px 8px;background:var(--surface)}
.comp{cursor:pointer}
.comp:hover{color:var(--accent)}
select{padding:11px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2);color:var(--text);font-size:14px}
.count{color:var(--muted);font-size:13px;padding:14px 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;padding-bottom:24px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;box-shadow:var(--shadow);display:flex;gap:12px;min-width:0}
.av{flex:none;width:42px;height:42px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700}
.info{min-width:0;flex:1}
.name{font-weight:650;overflow-wrap:anywhere}
.comp{display:inline-block;margin-top:3px;font-size:12px;background:var(--surface-2);color:var(--muted);border-radius:999px;padding:2px 9px;overflow-wrap:anywhere}
.phones{margin-top:8px;display:flex;flex-direction:column;gap:5px}
.ph{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ph a.num{color:var(--text);text-decoration:none;font-variant-numeric:tabular-nums}
.ph a.num:hover{color:var(--accent)}
.btn{border:1px solid var(--border);background:var(--surface-2);color:var(--muted);font-size:12px;border-radius:6px;padding:2px 7px;cursor:pointer;text-decoration:none}
.btn.wa{color:var(--wa)}
.btn:hover{border-color:var(--accent)}
.email{font-size:13px;color:var(--muted);margin-top:4px;overflow-wrap:anywhere}
mark{background:var(--accent-soft);color:inherit;border-radius:3px;padding:0 1px}
.more{display:block;margin:0 auto 32px;padding:10px 22px;border-radius:10px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:600;cursor:pointer}
.empty{text-align:center;color:var(--muted);padding:48px 0}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@media (max-width:560px){.top{gap:10px}.logo{height:40px}h1{font-size:17px}.grid{grid-template-columns:1fr}}
</style>
</head>

"n":"Ze","c":"Pref. Turiuba","p":["01518997559607"],"e":""},{"n":"Ze","c":"Prefeito Nipoa","p":["015 (17)99657-8551"],"e":""},{"n":"Ze","c":"Prefeitura Paledtina","p":["991872034"],"e":""},{"n":"Zé Rafael","c":"ARTES","p":["015 (17)99123-5540"],"e":""},{"n":"Ze Renato Mioto","c":"","p":["01517997045897"],"e":""},{"n":"Ze","c":"Renovacar","p":["991061398"],"e":""},{"n":"Ze Rissi","c":"","p":["+5517981072570"],"e":""},{"n":"Zé Roberto","c":"Borborema","p":["16997538716"],"e":""},{"n":"Ze Silva","c":"Dep Ded MG","p":["+556199496290"],"e":""},{"n":"Ze","c":"Tanabi","p":["981090005"],"e":""},{"n":"Zé","c":"Trovao","p":["+55 47 9105-3643"],"e":""},{"n":"Ze","c":"Turiuba","p":["015 (18)99635-5495"],"e":""},{"n":"Ze Vitor","c":"","p":["+5517997012326"],"e":""},{"n":"Zé Wilson","c":"","p":["015 (65)99980-0017"],"e":""},{"n":"Ze","c":"ZIP LUBI","p":["01517982268009"],"e":""},{"n":"Zeius","c":"","p":["015 (18)99777-9707"],"e":""},{"n":"Zenardi","c":"Roni TIPLER","p":["+5551993160639","+55(51) 3568-2222","+55"],"e":"ronieri.zenardi@tipler.com.br"},{"n":"Zeus","c":"Cutiano","p":["+5518997777773","015 (18)99777-9707"],"e":""},{"n":"Zezao","c":"Guapiaçu","p":["17981358863"],"e":""},{"n":"Zika","c":"Salva Vida","p":["01516993098575"],"e":""},{"n":"Zinho","c":"","p":["015 (18)98826-5504"],"e":""},{"n":"Zinho","c":"Wv","p":["+5518988265504"],"e":""},{"n":"ᒍoᥲ̃o ᕈᥲᥙꙆo","c":"","p":["+5517981579698"],"e":""}];
const PAGE = 120;
const norm = s => (s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const digits = s => (s || '').replace(/\D/g, '');
const esc = s => (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const companies = new Map();   // normalized company -> { label, count }
DATA.forEach(c => {
  c.key = norm([c.n, c.c, c.e].join(' '));
  c.dig = c.p.map(digits).join(' ');
  c.ck = norm(c.c).replace(/\s+/g, ' ').trim();
  if (c.ck) {
    const g = companies.get(c.ck) || { label: c.c, count: 0 };
    g.count++; companies.set(c.ck, g);
  }
});

const $ = id => document.getElementById(id);
const q = $('q'), list = $('list'), more = $('more'), companyIn = $('company');
let results = [], items = [], shown = 0, terms = [];
const collapsed = new Set();

$('companies').innerHTML = [...companies.values()]
  .filter(g => g.count > 1)
  .sort((a, b) => b.count - a.count || a.label.localeCompare(b.label, 'pt-BR'))
  .map(g => `<option value="${esc(g.label)}">${g.count} contatos</option>`).join('');

$('total').textContent = DATA.length.toLocaleString('pt-BR') + ' contatos';

function highlight(text) {
  let out = esc(text);
  if (!terms.length) return out;
  const n = norm(text);
  const ranges = [];
  terms.forEach(t => { let i = n.indexOf(t); while (i > -1) { ranges.push([i, i + t.length]); i = n.indexOf(t, i + t.length); } });
  if (!ranges.length) return out;
  ranges.sort((a, b) => a[0] - b[0]);
  let res = '', last = 0;
  ranges.forEach(([s, e]) => { if (s < last) return; res += esc(text.slice(last, s)) + '<mark>' + esc(text.slice(s, e)) + '</mark>'; last = e; });
  return res + esc(text.slice(last));
}

function waLink(p) {
  let d = digits(p);
  if (d.startsWith('015')) d = d.slice(3);
  if (d.startsWith('0')) d = d.slice(1);
  if (d.length <= 11) d = '55' + d;
  return 'https://wa.me/' + d;
}

function initials(n) {
  const w = (n || '?').replace(/[^\p{L}\s]/gu, ' ').trim().split(/\s+/);
  return ((w[0] || '?')[0] + (w[1] ? w[1][0] : '')).toUpperCase();
}

function card(c) {
  const phones = c.p.map(p => `
    <div class="ph">
      <a class="num" href="tel:${esc(digits(p))}">${highlight(p)}</a>
      <a class="btn wa" href="${waLink(p)}" target="_blank" rel="noopener">WhatsApp</a>
      <button class="btn" data-copy="${esc(p)}">Copiar</button>
    </div>`).join('');
  return `<div class="card">
    <div class="av">${esc(initials(c.n))}</div>
    <div class="info">
      <div class="name">${highlight(c.n || 'Sem nome')}</div>
      ${c.c ? `<span class="comp" data-company="${esc(c.c)}" title="Filtrar por esta empresa">${highlight(c.c)}</span>` : ''}
      ${phones ? `<div class="phones">${phones}</div>` : ''}
      ${c.e ? `<div class="email">${highlight(c.e)}</div>` : ''}
    </div>
  </div>`;
}

function run() {
  const raw = q.value.trim();
  terms = norm(raw).split(/\s+/).filter(Boolean);
  const qd = digits(raw);
  const f = $('filter').value, grouped = $('group').checked;
  const s = grouped ? 'comp' : $('sort').value;
  const cf = norm(companyIn.value).replace(/\s+/g, ' ').trim();
  results = DATA.filter(c => {
    if (f === 'comp' && !c.c) return false;
    if (f === 'nocomp' && c.c) return false;
    if (cf && !c.ck.includes(cf)) return false;
    if (!terms.length) return true;
    if (terms.every(t => c.key.includes(t))) return true;
    return qd.length >= 3 && qd.length === raw.replace(/[\s()+\-.]/g, '').length && c.dig.includes(qd);
  });
  // contacts without a company (when sorting by company) or whose "name" is just a number go last
  const rank = c => (s === 'comp' && !c.c ? 2 : 0) + (/\p{L}/u.test(c.n) ? 0 : 1);
  const key = t => norm(t).replace(/^[^\p{L}]+/u, '');   // ignore leading emoji/digits/symbols
  const cmp = (x, y) => x.localeCompare(y, 'pt-BR');
  const crank = c => !c.ck ? 2 : /\p{L}/u.test(c.ck) ? 0 : 1;   // "Sem empresa" last, number-only companies before it
  results.sort((a, b) => s === 'comp'
    // company first, kept whole so each company forms one contiguous block
    ? crank(a) - crank(b) || cmp(key(a.ck), key(b.ck)) || a.ck.localeCompare(b.ck) || rank(a) - rank(b) || cmp(key(a.n), key(b.n))
    : rank(a) - rank(b) || cmp(key(a.n), key(b.n)));

  items = results;
  let groupCount = 0;
  if (grouped) {
    const counts = new Map();
    results.forEach(c => counts.set(c.ck, (counts.get(c.ck) || 0) + 1));
    groupCount = [...counts.keys()].filter(Boolean).length;
    items = []; let prev = null;
    results.forEach(c => {
      if (c.ck !== prev) {
        prev = c.ck;
        items.push({ header: true, ck: c.ck, label: c.ck ? (companies.get(c.ck).label) : 'Sem empresa', count: counts.get(c.ck) });
      }
      if (!collapsed.has(c.ck)) items.push(c);
    });
  }

  shown = 0; list.innerHTML = '';
  const n = results.length;
  $('count').textContent = n
    ? n.toLocaleString('pt-BR') + (n === 1 ? ' contato encontrado' : ' contatos encontrados')
      + (grouped ? ` em ${groupCount.toLocaleString('pt-BR')} ${groupCount === 1 ? 'empresa' : 'empresas'}` : '')
    : '';
  if (!n) list.innerHTML = '<div class="empty">Nenhum contato encontrado.</div>';
  render();
  $('clear').style.display = raw ? 'block' : 'none';
  $('clearCompany').style.display = companyIn.value ? 'block' : 'none';
  $('sort').disabled = grouped;
}

function header(g) {
  return `<div class="group-h${collapsed.has(g.ck) ? ' closed' : ''}" data-group="${esc(g.ck)}">
    <span class="gname">${highlight(g.label)}</span>
    <span class="gcount">${g.count}</span>
    ${g.ck && norm(companyIn.value).trim() !== g.ck ? `<button class="only" data-company="${esc(g.label)}">Só esta empresa</button>` : ''}
    <span class="chev">▾</span>
  </div>`;
}

function render() {
  const slice = items.slice(shown, shown + PAGE);
  list.insertAdjacentHTML('beforeend', slice.map(i => i.header ? header(i) : card(i)).join(''));
  shown += slice.length;
  const left = items.slice(shown).filter(i => !i.header).length;
  more.style.display = shown < items.length ? 'block' : 'none';
  more.textContent = `Mostrar mais (${left.toLocaleString('pt-BR')} restantes)`;
}

function setCompany(v) {
  companyIn.value = v;
  collapsed.clear();
  run();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

let timer;
q.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(run, 120); });
$('clear').addEventListener('click', e => { e.preventDefault(); q.value = ''; run(); q.focus(); });
$('filter').addEventListener('change', run);
$('sort').addEventListener('change', run);
$('group').addEventListener('change', () => { collapsed.clear(); run(); });
let ctimer;
companyIn.addEventListener('input', () => { clearTimeout(ctimer); ctimer = setTimeout(run, 120); });
$('clearCompany').addEventListener('click', e => { e.preventDefault(); setCompany(''); companyIn.focus(); });
more.addEventListener('click', render);
new IntersectionObserver(es => { if (es[0].isIntersecting && shown < items.length) render(); }).observe(more);

list.addEventListener('click', e => {
  const pick = e.target.closest('[data-company]');
  if (pick) { setCompany(pick.dataset.company); return; }
  const h = e.target.closest('[data-group]');
  if (h) {
    const k = h.dataset.group;
    collapsed.has(k) ? collapsed.delete(k) : collapsed.add(k);
    const y = h.getBoundingClientRect().top;
    run();
    const again = list.querySelector(`[data-group="${CSS.escape(k)}"]`);
    if (again) window.scrollBy(0, again.getBoundingClientRect().top - y);
    return;
  }
  const b = e.target.closest('[data-copy]');
  if (!b) return;
  const v = b.dataset.copy;
  const done = () => { const t = $('toast'); t.textContent = 'Copiado: ' + v; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 1400); };
  if (navigator.clipboard) navigator.clipboard.writeText(v).then(done, done); else done();
});

$('theme').addEventListener('click', () => {
  const r = document.documentElement;
  const dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  r.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('tema', r.dataset.theme); } catch (e) {}
});
try { const t = localStorage.getItem('tema'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}

run();
</script>
